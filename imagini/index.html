
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie imagini</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            font-family: Arial, sans-serif;
            background: #f6f8fa;
            color: #24292f;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            background: white;
            padding: 25px;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
        }

        header p {
            color: #656d76;
            margin: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 15px #00000012;
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .card p {
            padding: 14px;
            margin: 0;
            font-weight: bold;
            font-size: 14px;
        }

        .card a {
            color: inherit;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #656d76;
            padding: 30px 10px;
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #0969da;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🖼️ Galerie de imagini</h1>
        <p>Galerie foto – Proiecte și materiale media</p>
        <a href="../index.html" class="back">← Înapoi la pagina principală</a>
    </header>

    <div class="gallery">

        <!-- Imaginea 1 -->
        <div class="card">
            <a href="diagrama.png" target="_blank">
                <img src="diagrama.png" alt="Diagrama proiectului">
                <p>Diagrama proiectului</p>
            </a>
        </div>

        <!-- Adaugă alte imagini după acest model -->

    </div>

    <footer>
        Galerie realizată pentru disciplina Producție media
        <br><br>
        © 2026
    </footer>

</div>

</body>
</html>
